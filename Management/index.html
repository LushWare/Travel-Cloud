<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lush Travel Cloud Management</title>
    <!-- Sets the dark class before first paint to avoid a flash of the wrong
         theme. Keep the 'management-theme' key in sync with STORAGE_KEY in
         src/contexts/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('management-theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // localStorage/matchMedia unavailable — fall back to light, same default as ThemeContext.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
