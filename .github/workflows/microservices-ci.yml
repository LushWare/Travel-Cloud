name: Microservices CI

on:
  pull_request:
    branches: [main]
    paths: &ci-paths
      - 'Services/shared/contracts/**'
      - 'Services/analytics-service/**'
      - 'Services/assistant-service/**'
      - 'Services/auth-service/**'
      - 'Services/billing-service/**'
      - 'Services/booking-service/**'
      - 'Services/career-service/**'
      - 'Services/flight-service/**'
      - 'Services/lead-service/**'
      - 'Services/notification-service/**'
      - 'Services/package-service/**'
      - 'Services/recommendation-service/**'
      - 'Services/user-service/**'
      - 'Services/voice-service/**'
      - 'Management/**'
      - '.github/workflows/microservices-ci.yml'
  push:
    branches: [main]
    paths: *ci-paths

env:
  NODE_VERSION: '20.x'

jobs:
  contracts:
    name: shared/contracts tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Services/shared/contracts/package-lock.json

      - name: Install
        working-directory: Services/shared/contracts
        run: npm ci

      - name: Lint
        working-directory: Services/shared/contracts
        run: npm run lint

      - name: Test
        working-directory: Services/shared/contracts
        run: npm test

  # One job per backend service, driven by a matrix rather than a copied block.
  # Eight services had test suites that never ran in CI, so a change to any of
  # them could ship with its tests red and nobody would see it.
  #
  # `fail-fast: false` is deliberate: one service failing must not cancel the
  # others, or a single red suite hides the state of every other one.
  service:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: lead-service,         contracts: true,  lint: true }
          - { service: billing-service,      contracts: true,  lint: true }
          - { service: assistant-service,    contracts: true,  lint: true }
          - { service: voice-service,        contracts: false, lint: true }
          - { service: user-service,         contracts: true,  lint: false }
          - { service: analytics-service,    contracts: false, lint: false }
          - { service: auth-service,         contracts: false, lint: false }
          - { service: booking-service,      contracts: false, lint: false }
          - { service: career-service,       contracts: false, lint: false }
          - { service: notification-service, contracts: false, lint: false }
          - { service: recommendation-service, contracts: false, lint: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Services/shared/contracts/package-lock.json
            Services/${{ matrix.service }}/package-lock.json

      # Services that depend on @travel-crm/contracts do so via a `file:` link,
      # so the shared package's own node_modules must exist before `npm ci` in
      # the service can resolve it — these are independent npm projects with no
      # workspace, which is why the install is a separate conditional step.
      - name: Install shared/contracts
        if: matrix.contracts
        working-directory: Services/shared/contracts
        run: npm ci

      - name: Install ${{ matrix.service }}
        working-directory: Services/${{ matrix.service }}
        run: npm ci

      # Not every service has a lint script yet; `lint: false` above skips this
      # rather than failing on a missing script.
      - name: Lint
        if: matrix.lint
        working-directory: Services/${{ matrix.service }}
        run: npm run lint

      - name: Test
        working-directory: Services/${{ matrix.service }}
        run: npm test

  management:
    name: Management tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Services/shared/contracts/package-lock.json
            Management/package-lock.json

      - name: Install shared/contracts
        working-directory: Services/shared/contracts
        run: npm ci

      # --legacy-peer-deps works around a pre-existing, unrelated conflict
      # between this package's vite version and @vitejs/plugin-react's peer
      # range. Not introduced by this workflow — remove once that's fixed.
      - name: Install Management
        working-directory: Management
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: Management
        run: npm run lint

      - name: Test
        working-directory: Management
        run: npm test

  package-service:
    name: package-service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Services/package-service/package-lock.json

      - name: Install
        working-directory: Services/package-service
        run: npm ci

      - name: Lint
        working-directory: Services/package-service
        run: npm run lint

      # test:ci excludes the two hotels.*.live.*.test.js suites, which hit
      # the real LiteAPI service and require LITEAPI_API_KEY — not something
      # to run against a paid third-party API on every CI push.
      - name: Test
        working-directory: Services/package-service
        run: npm run test:ci

  # NOT COVERED: flight-service. Its integration suite (test/integration/
  # flights.api.test.js) currently has 7 failing tests on `main` —
  # pre-existing, and untouched by this workflow. They appear to be drift from
  # the `feat(flight-service): add Zod validation layer` commit: the search/book
  # payloads now fail validation (422) and two endpoints answer 404, so the
  # tests were written against the pre-validation API. Wiring the job in before
  # that is fixed would make CI red for everyone. Its `Services/flight-service/**`
  # path trigger is kept above so the gap stays visible in the workflow diff.

  ci-status:
    name: Microservices CI Status
    runs-on: ubuntu-latest
    needs: [contracts, service, management, package-service]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.contracts.result }}" != "success" ] || \
             [ "${{ needs.service.result }}" != "success" ] || \
             [ "${{ needs.management.result }}" != "success" ] || \
             [ "${{ needs.package-service.result }}" != "success" ]; then
            echo "Microservices CI failed"
            exit 1
          fi
          echo "Microservices CI passed"
